name: KitsuTrack
options:
  bundleIdPrefix: net.alepouna
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  KitsuTrack:
    type: application
    platform: iOS
    sources: [KitsuTrack]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alepouna.kitsutrack
        PRODUCT_NAME: KitsuTrack
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "TrueDepth face tracking provides head pose to your simulator."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Network Mode sends head tracking directly to OpenTrack on your PC."
        INFOPLIST_KEY_CFBundleDisplayName: KitsuTrack
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: ARKit.framework
      - sdk: Network.framework
