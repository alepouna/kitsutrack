<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KitsuTrack Bridge Logs</title><link rel="stylesheet" href="style.css?v=7"></head><body>
<header><div class="title"><button id="back" class="icon-button" hidden aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div><h1 id="title">KitsuTrack Bridge Logs</h1><p id="summary">Loading launch logs…</p></div></div><div id="main-actions"><button id="delete-all" class="danger">Delete All</button><button id="export-all" class="primary"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>Export All</button></div><div id="file-actions" hidden><button id="delete-file" class="danger">Delete</button><button id="reveal-file" class="primary"><svg viewBox="0 0 24 24"><path d="M3 7h5l2 2h11v10H3z"/></svg>Show in Folder</button></div></header>
<section id="toolbar" class="toolbar" hidden><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="Search this log"></label><div class="filters"><button class="active" data-level="all">All</button><button data-level="info">Info</button><button data-level="warning">Warnings</button><button data-level="error">Errors</button></div></section>
<main id="files"></main><main id="entries" hidden></main>
<section id="empty" class="empty" hidden><div><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg></div><h2>No launch logs</h2><p>New bridge launches will appear here automatically.</p></section>
<template id="file-template"><article class="file-card"><button class="file-open"><div class="file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg></div><div><strong></strong><p class="file-meta"></p><div class="severity"></div></div></button><div class="card-actions"><button class="icon-button reveal" title="Show in folder"><svg viewBox="0 0 24 24"><path d="M3 7h5l2 2h11v10H3z"/></svg></button><button class="icon-button delete" title="Delete log"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></svg></button></div></article></template>
<template id="entry-template"><article class="entry"><div class="meta"><span class="level"></span><time></time></div><p></p><button class="copy icon-button" title="Copy line"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></article></template>
<dialog id="confirm-modal"><div class="modal-icon"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></svg></div><h2 id="modal-title">Delete logs?</h2><p id="modal-message"></p><div class="modal-actions"><button id="cancel-delete">Cancel</button><button id="confirm-delete" class="danger">Delete</button></div></dialog><script src="app.js"></script></body></html>
