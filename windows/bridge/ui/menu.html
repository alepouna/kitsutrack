<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KitsuTrack Bridge</title>
    <link rel="stylesheet" href="menu.css">
  </head>
  <body>
    <main>
      <header>
        <h1>KitsuTrack Bridge</h1>
        <p id="status" class="disconnected"><i></i>Disconnected</p>
      </header>
      <section class="details">
        <div><span>iPhone</span><strong id="iphone">Not connected</strong></div>
        <div><span>Tracking Rate</span><strong id="rate">Not connected</strong></div>
      </section>
      <nav>
        <button id="retry" class="hidden" data-command="menu_state">Retry UI</button>
        <button data-command="open_logs"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>Logs</button>
        <button id="check-updates" data-command="check_for_updates"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.2 6.5L3 16"/><path d="M3 21v-5h5M3 12A9 9 0 0 1 18.2 5.5L21 8"/><path d="M21 3v5h-5"/></svg><span>Check for Updates</span></button>
        <button data-command="report_feedback"><svg class="github" viewBox="0 0 24 24"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.24c-3.23.7-3.91-1.37-3.91-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.58-.29-5.29-1.29-5.29-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.72 5.39-5.3 5.68.42.36.79 1.06.79 2.14v3.18c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7z"/></svg>Report a Bug / Suggest a Feature</button>
        <button data-command="open_about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.01"/></svg>About KitsuTrack</button>
      </nav>
      <footer><button class="quit" data-command="quit"><svg viewBox="0 0 24 24"><path d="M12 2v10m6.36-6.36a9 9 0 1 1-12.72 0"/></svg>Quit</button></footer>
    </main>
    <script src="menu.js"></script>
  </body>
</html>
