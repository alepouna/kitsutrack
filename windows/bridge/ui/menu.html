<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KitsuTrack Bridge</title>
    <link rel="stylesheet" href="menu.css">
  </head>
  <body>
    <main>
      <header>
        <h1>KitsuTrack Bridge</h1>
        <p id="status" class="disconnected"><i></i>Disconnected</p>
      </header>
      <section class="details">
        <div><span>iPhone</span><strong id="iphone">Not connected</strong></div>
        <div><span>Tracking Rate</span><strong id="rate">—</strong></div>
      </section>
      <nav>
        <button data-command="open_logs"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h5"/></svg>Logs</button>
        <button data-command="check_for_updates"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2 5M20 4v7h-7"/></svg>Check for Updates</button>
        <button id="update" class="hidden" data-command="open_update_command"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>Update Available</button>
        <button data-command="report_feedback"><svg class="github" viewBox="0 0 24 24"><path d="M15 22v-3.9c.04-1 .3-1.7.78-2.06 2.55-.28 5.22-1.25 5.22-5.67a4.43 4.43 0 0 0-1.18-3.08 4.13 4.13 0 0 0-.11-3.04s-.96-.31-3.15 1.18a10.8 10.8 0 0 0-5.73 0C8.74 3.94 7.78 4.25 7.78 4.25a4.13 4.13 0 0 0-.11 3.04 4.43 4.43 0 0 0-1.18 3.08c0 4.41 2.66 5.4 5.2 5.68.39.34.74.99.74 1.99V22"/><path d="M9 19c-3 .9-3-1.5-4.2-1.8"/></svg>Report a Bug / Suggest a Feature</button>
        <button data-command="open_about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.01"/></svg>About KitsuTrack</button>
      </nav>
      <footer><button class="quit" data-command="quit"><svg viewBox="0 0 24 24"><path d="M12 2v10m6.36-6.36a9 9 0 1 1-12.72 0"/></svg>Quit</button></footer>
    </main>
    <script src="menu.js"></script>
  </body>
</html>
