name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test and build the Tauri bridge
        shell: pwsh
        run: |
          cargo test --workspace --release
          cargo build --release -p kitsutrack-bridge
          if (-not (Test-Path target\release\kitsutrack-bridge.exe)) { throw "Tauri bridge executable was not produced" }
      - name: Assemble portable package
        shell: pwsh
        run: .\windows\package.ps1 -SkipBuild
      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path windows\dist\KitsuTrack\* -DestinationPath windows\dist\KitsuTrack-Windows-Portable-x64.zip
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: KitsuTrack-Windows
          path: |
            windows/dist/KitsuTrack-Windows-Portable-x64.zip
            windows/dist/KitsuTrack-Windows-Setup-x64.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            windows/dist/KitsuTrack-Windows-Portable-x64.zip
            windows/dist/KitsuTrack-Windows-Setup-x64.exe
